<html>
<head><title>Meridian Credit Union - Servicing Console</title></head>
<body bgcolor="#ffffff">
<table width="100%" cellpadding="4" cellspacing="0" border="0" bgcolor="#003366">
<tr><td><font color="white" size="4"><b>Meridian Credit Union &mdash; Member Servicing</b></font></td></tr>
</table>
<br>
<table align="center" border="0" cellpadding="6">
<tr><td colspan="2" align="center"><b>Operator Sign In</b></td></tr>
{% if error %}
<tr><td colspan="2" align="center"><font color="red">{{ error }}</font></td></tr>
{% endif %}
<form method="POST" action="/login">
<tr><td>Username</td><td><input type="text" name="username"></td></tr>
<tr><td>Password</td><td><input type="password" name="password"></td></tr>
<tr><td colspan="2" align="center"><input type="submit" value="Sign In"></td></tr>
</form>
</table>
</body>
</html>
