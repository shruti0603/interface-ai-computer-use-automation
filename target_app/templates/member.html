<html>
<head><title>Member {{ member_id }}</title></head>
<body bgcolor="#ffffff">
<table width="100%" cellpadding="4" cellspacing="0" border="0" bgcolor="#003366">
<tr><td><font color="white" size="4"><b>Meridian Credit Union &mdash; Member Servicing</b></font></td>
<td align="right"><a href="/logout"><font color="white">Sign Out</font></a></td></tr>
</table>
<br>
<table align="center" border="1" cellpadding="8" cellspacing="0">
<tr><td colspan="2" bgcolor="#eeeeee"><b>Member Record: {{ member_id }}</b></td></tr>
<tr><td>Name</td><td>{{ m.name }}</td></tr>
<tr><td>Status</td><td>{{ m.status }}</td></tr>
<tr>
  <td colspan="2">
    <table border="1" cellpadding="6" cellspacing="0" width="100%">
      <tr bgcolor="#dddddd"><td><b>Account</b></td><td><b>Balance</b></td></tr>
      <tr><td>Savings</td><td>${{ "%.2f"|format(m.savings) }}</td></tr>
      <tr><td>Checking</td><td>${{ "%.2f"|format(m.checking) }}</td></tr>
    </table>
  </td>
</tr>
<tr><td colspan="2" align="center">
  <a href="/member/{{ member_id }}/new-subaccount">Open New Sub-Account</a>
  &nbsp;|&nbsp;
  <a href="/search">Back to Search</a>
</td></tr>
</table>
</body>
</html>
